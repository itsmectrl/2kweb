<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — All2K</title>
  <meta name="theme-color" content="#0a0a0a">
  <style>
    :root { --ink: #0a0a0a; --paper: #f3f3f0; --m: #5c5c58; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper) radial-gradient(rgba(10,10,10,0.14) 1.1px, transparent 1.3px) 0 0 / 14px 14px;
      color: var(--ink);
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .card {
      max-width: 520px;
      width: 100%;
      border: 2px solid var(--ink);
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      padding: 28px 24px;
      display: grid;
      gap: 16px;
    }
    h1 {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(56px, 16vw, 112px);
      line-height: 0.9;
      letter-spacing: -0.04em;
    }
    p { font-size: 16px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 var(--m);
    }
    a.alt {
      background: var(--paper);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>That street corner doesn’t exist. Head back to All2K or grab the latest Android release directly.</p>
    <div class="actions">
      <a id="home-link" href="./">Back to All2K</a>
      <a class="alt" href="https://github.com/itsmectrl/All2K-new/releases/latest">Download APK</a>
    </div>
  </main>
  <script>
    (() => {
      const a = document.getElementById('home-link');
      if (!a) return;
      const p = location.pathname;
      a.href = p.startsWith('/All2K-new/') || p === '/All2K-new' ? '/All2K-new/' : './';
    })();
  </script>
</body>
</html>
